# Pull the EPD past-24-hour AQHI XML and publish data/aqhi.json.
# The page is static. GitHub Pages serves this branch's root. A failed fetch
# exits before any write, so the last good JSON stays in place. Identical
# readings do not change the file, so this job does not commit.
#
# Owner setting: Settings → Actions → General → Workflow permissions →
# Read and write permissions. Pages stays "Deploy from a branch", branch
# main, folder / (root). If a ruleset blocks the Actions bot from main, allow
# github-actions[bot] to push.
name: Update AQHI

on:
  schedule:
    # Minute 20 of every hour. EPD usually posts the file around minute 10
    # Hong Kong time, and Hong Kong is UTC+8 so the minute is the same.
    # GitHub may start the job later than the cron time.
    - cron: "20 * * * *"
  workflow_dispatch:
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run unit tests
        run: python3 scripts/test_fetch.py

  update:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    concurrency:
      group: update-hk-aqhi
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Fetch AQHI XML
        run: python3 scripts/fetch_aqhi.py
        env:
          PYTHONUNBUFFERED: "1"

      - name: Publish when the readings change
        if: github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- data/aqhi.json && git diff --cached --quiet -- data/aqhi.json; then
            echo "No change in the AQHI readings."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/aqhi.json
          git commit -m "Update AQHI readings"
          # One attempt, then four retries. Never force-push: a failed rebase
          # is aborted so main is left untouched.
          attempt=0
          while true; do
            if git fetch origin main && git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            attempt=$((attempt + 1))
            if [ "$attempt" -gt 4 ]; then
              echo "could not publish; the last good JSON stays on main"
              exit 1
            fi
            delay=$((4 << (attempt - 1)))
            echo "publish attempt failed; retrying in ${delay}s"
            sleep "$delay"
          done
